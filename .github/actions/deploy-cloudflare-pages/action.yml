name: Deploy assembled site to Cloudflare Pages
description: Adapt the shared Pages artifact for unpdf.me and upload it to Cloudflare Pages.

inputs:
  cloudflare-account-id:
    description: Cloudflare account that owns the Pages project.
    required: true
  cloudflare-api-token:
    description: API token with Cloudflare Pages edit permission.
    required: true

runs:
  using: composite
  steps:
    - name: Download assembled Pages site
      uses: actions/download-artifact@v8.0.1
      with:
        name: pages-site-state
        path: artifacts/pages

    - name: Prepare Cloudflare Pages tree
      shell: bash
      run: >-
        python3 eng/prepare_cloudflare_pages_site.py
        --site artifacts/pages
        --application-path now
        --base-path /now/

    - name: Deploy to Cloudflare Pages
      id: deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: >-
          pages deploy artifacts/pages
          --project-name=unpdf-me
          --branch=main
          --commit-hash=${{ github.sha }}

    - name: Verify Cloudflare Pages deployment
      shell: bash
      run: |
        fetch() {
          curl --retry 24 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 -fsS "$@"
        }
        fetch "https://unpdf-me.pages.dev/?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cloudflare-index.html"
        fetch "https://unpdf-me.pages.dev/now/?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cloudflare-now.html"
        grep -Fq 'PdfBox.Net' "$RUNNER_TEMP/cloudflare-index.html"
        grep -Fq '<base href="/now/"' "$RUNNER_TEMP/cloudflare-now.html"
        grep -F 'id="unpdf-csp"' "$RUNNER_TEMP/cloudflare-now.html"
        grep -F "connect-src 'self'" "$RUNNER_TEMP/cloudflare-now.html"
        headers="$(fetch -D - -o /dev/null "https://unpdf-me.pages.dev/now/?run=$GITHUB_RUN_ID" | tr -d '\r')"
        printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
        printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY$'
        if printf '%s\n' "$headers" | grep -qi '^set-cookie:'; then
          echo "Cloudflare Pages unexpectedly set a cookie" >&2
          exit 1
        fi
        fetch https://unpdf-me.pages.dev/now/samples/hello.pdf -o "$RUNNER_TEMP/cloudflare-hello.pdf"
        grep -a -q '%PDF-' "$RUNNER_TEMP/cloudflare-hello.pdf"
        framework_wasm="$(find artifacts/pages/now/_framework -maxdepth 1 -name 'dotnet.native.*.wasm' -type f -print -quit)"
        test -n "$framework_wasm"
        framework_wasm="${framework_wasm#artifacts/pages/now/}"
        content_type="$(fetch -o /dev/null -w '%{content_type}' "https://unpdf-me.pages.dev/now/$framework_wasm?run=$GITHUB_RUN_ID")"
        case "$content_type" in
          application/wasm*) ;;
          *) echo "Unexpected Cloudflare WebAssembly content type: $content_type" >&2; exit 1 ;;
        esac
