name: Deploy assembled site to Cloudflare Pages
description: Adapt the shared Pages artifact for unpdf.me and upload it to Cloudflare Pages.

inputs:
  cloudflare-account-id:
    description: Cloudflare account that owns the Pages project.
    required: true
  cloudflare-api-token:
    description: API token with Cloudflare Pages edit and Zone DNS edit permissions.
    required: true

runs:
  using: composite
  steps:
    - name: Download assembled Pages site
      uses: actions/download-artifact@v8.0.1
      with:
        name: pages-site-state
        path: artifacts/pages

    - name: Prepare Cloudflare Pages tree
      shell: bash
      run: >-
        python3 eng/prepare_cloudflare_pages_site.py
        --site artifacts/pages
        --application-path now
        --base-path /now/

    - name: Deploy to Cloudflare Pages
      id: deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: >-
          pages deploy artifacts/pages
          --project-name=unpdf-me
          --branch=main
          --commit-hash=${{ github.sha }}

    - name: Register unpdf.me custom domain
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
      run: |
        domain_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/unpdf-me/domains/unpdf.me"
        domain_response="$RUNNER_TEMP/cloudflare-domain.json"
        request_domain() {
          curl --retry 4 --retry-all-errors --retry-delay 2 -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -o "$domain_response" -w '%{http_code}' "$@"
        }

        http_status="$(request_domain "$domain_api")"
        case "$http_status" in
          200)
            ;;
          404)
            http_status="$(request_domain -X POST -d '{"name":"unpdf.me"}' "${domain_api%/unpdf.me}")"
            test "$http_status" = 200
            jq -e '.success == true' "$domain_response" >/dev/null
            ;;
          *)
            jq -c '.errors // .' "$domain_response" >&2
            exit 1
            ;;
        esac

    - name: Point unpdf.me DNS to Cloudflare Pages
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
      run: |
        api="https://api.cloudflare.com/client/v4"
        api_response="$RUNNER_TEMP/cloudflare-dns.json"
        request_cloudflare() {
          curl --retry 4 --retry-all-errors --retry-delay 2 -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -o "$api_response" -w '%{http_code}' "$@"
        }
        require_success() {
          local http_status="$1"
          if [[ "$http_status" != 200 ]] || ! jq -e '.success == true' "$api_response" >/dev/null; then
            jq -c '.errors // .' "$api_response" >&2
            echo "The Cloudflare token needs Zone / DNS / Edit permission for unpdf.me." >&2
            exit 1
          fi
        }

        http_status="$(request_cloudflare --get \
          --data-urlencode 'name=unpdf.me' \
          --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
          "$api/zones")"
        require_success "$http_status"
        zone_id="$(jq -er '.result | map(select(.name == "unpdf.me" and .status == "active")) | if length == 1 then .[0].id else error("Expected one active unpdf.me zone") end' "$api_response")"

        http_status="$(request_cloudflare --get \
          --data-urlencode 'name=unpdf.me' \
          --data-urlencode 'per_page=100' \
          "$api/zones/$zone_id/dns_records")"
        require_success "$http_status"

        mapfile -t routing_record_ids < <(jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' "$api_response")
        if [[ "${#routing_record_ids[@]}" == 1 ]] &&
          jq -e '.result[] | select((.type == "CNAME") and (.content == "unpdf-me.pages.dev") and (.proxied == true))' "$api_response" >/dev/null; then
          echo "unpdf.me DNS already points to unpdf-me.pages.dev"
          exit 0
        fi

        for record_id in "${routing_record_ids[@]}"; do
          http_status="$(request_cloudflare -X DELETE "$api/zones/$zone_id/dns_records/$record_id")"
          require_success "$http_status"
        done

        dns_record="$(jq -nc '{type:"CNAME", name:"unpdf.me", content:"unpdf-me.pages.dev", proxied:true, ttl:1}')"
        http_status="$(request_cloudflare -X POST -d "$dns_record" "$api/zones/$zone_id/dns_records")"
        require_success "$http_status"
        echo "Pointed unpdf.me DNS to unpdf-me.pages.dev"

    - name: Activate unpdf.me custom domain
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
      run: |
        domain_api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/unpdf-me/domains/unpdf.me"
        domain_response="$RUNNER_TEMP/cloudflare-domain.json"
        request_domain() {
          curl --retry 4 --retry-all-errors --retry-delay 2 -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -o "$domain_response" -w '%{http_code}' "$@"
        }

        http_status="$(request_domain "$domain_api")"
        test "$http_status" = 200
        domain_status="$(jq -r '.result.status // empty' "$domain_response")"
        if [[ "$domain_status" != "active" && "$domain_status" != "blocked" ]]; then
          printf 'Retrying unpdf.me Pages domain validation from status: %s\n' "$domain_status"
          http_status="$(request_domain -X PATCH -d '{}' "$domain_api")"
          test "$http_status" = 200
          jq -e '.success == true' "$domain_response" >/dev/null
        fi

        domain_status=""
        for _ in $(seq 1 90); do
          http_status="$(request_domain "$domain_api")"
          if [[ "$http_status" == 200 ]]; then
            domain_status="$(jq -r '.result.status // empty' "$domain_response")"
            printf 'unpdf.me Pages domain status: %s\n' "$domain_status"
            case "$domain_status" in
              active) break ;;
              blocked|error)
                jq -c '{status: .result.status, validation: .result.validation_data, verification: .result.verification_data}' "$domain_response" >&2
                exit 1
                ;;
            esac
          fi
          sleep 10
        done
        if [[ "$domain_status" != "active" ]]; then
          jq -c '{status: .result.status, validation: .result.validation_data, verification: .result.verification_data}' "$domain_response" >&2
          exit 1
        fi

    - name: Verify Cloudflare Pages deployment
      shell: bash
      run: |
        fetch() {
          curl --retry 24 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            --connect-timeout 15 --max-time 60 -fsS "$@"
        }
        fetch "https://unpdf-me.pages.dev/?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cloudflare-index.html"
        fetch "https://unpdf-me.pages.dev/now/?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cloudflare-now.html"
        fetch "https://unpdf.me/?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cloudflare-custom-index.html"
        fetch "https://unpdf.me/now/?run=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/cloudflare-custom-now.html"
        grep -Fq 'PdfBox.Net' "$RUNNER_TEMP/cloudflare-index.html"
        grep -Fq '<base href="/now/"' "$RUNNER_TEMP/cloudflare-now.html"
        grep -Fq 'PdfBox.Net' "$RUNNER_TEMP/cloudflare-custom-index.html"
        grep -Fq '<base href="/now/"' "$RUNNER_TEMP/cloudflare-custom-now.html"
        grep -F 'id="unpdf-csp"' "$RUNNER_TEMP/cloudflare-now.html"
        grep -F "connect-src 'self'" "$RUNNER_TEMP/cloudflare-now.html"
        headers="$(fetch -D - -o /dev/null "https://unpdf-me.pages.dev/now/?run=$GITHUB_RUN_ID" | tr -d '\r')"
        printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
        printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY$'
        if printf '%s\n' "$headers" | grep -qi '^set-cookie:'; then
          echo "Cloudflare Pages unexpectedly set a cookie" >&2
          exit 1
        fi
        fetch https://unpdf-me.pages.dev/now/samples/hello.pdf -o "$RUNNER_TEMP/cloudflare-hello.pdf"
        grep -a -q '%PDF-' "$RUNNER_TEMP/cloudflare-hello.pdf"
        framework_wasm="$(find artifacts/pages/now/_framework -maxdepth 1 -name 'dotnet.native.*.wasm' -type f -print -quit)"
        test -n "$framework_wasm"
        framework_wasm="${framework_wasm#artifacts/pages/now/}"
        content_type="$(fetch -o /dev/null -w '%{content_type}' "https://unpdf-me.pages.dev/now/$framework_wasm?run=$GITHUB_RUN_ID")"
        case "$content_type" in
          application/wasm*) ;;
          *) echo "Unexpected Cloudflare WebAssembly content type: $content_type" >&2; exit 1 ;;
        esac
